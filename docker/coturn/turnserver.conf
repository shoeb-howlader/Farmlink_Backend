# ==============================================================================
# Coturn TURN/STUN Configuration for Coolify / Docker
# ==============================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# Realm and domain
realm=farmlinkcare.com

# WebRTC Ephemeral Auth & Secret
fingerprint
use-auth-secret
static-auth-secret=farmlink_bdix_turn_secret_2026_x89q4w
stale-nonce=600

# Relay IP & Ports
# Replace with your VPS / Coolify server's public IP address
# external-ip=YOUR_SERVER_PUBLIC_IP
min-port=49152
max-port=65535

# Hardening & Security
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
user-quota=10
total-quota=1000

# Logging
verbose
syslog
