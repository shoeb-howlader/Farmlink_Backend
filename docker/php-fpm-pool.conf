; FarmLink High-Concurrency PHP-FPM Pool Configuration
; Overrides default Alpine pm.max_children = 5 in /usr/local/etc/php-fpm.d/www.conf

[www]
pm = dynamic
pm.max_children = 120
pm.start_servers = 20
pm.min_spare_servers = 10
pm.max_spare_servers = 40
pm.max_requests = 1000

; Request timeouts & worker resource limits
request_terminate_timeout = 60s
rlimit_files = 65535
rlimit_core = 0
catch_workers_output = yes
decorate_workers_output = no

; Slow request logging for performance diagnostics (>5 seconds)
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 5s
